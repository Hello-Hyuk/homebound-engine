[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homebound"
version = "0.1.0"
description = "GPS trajectory homebound decision engine for Android and iOS, proposal only, no automatic control"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
homebound = "homebound.cli:main"
